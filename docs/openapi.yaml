openapi: 3.0.3
info:
  title: Ticker API
  version: 1.0.0
  description: |
    URL shortener with analytics.

    The short links themselves are served at `GET /{code}` (a 302 redirect, outside `/api`).

    Errors always look like `{ "error": { "code": "...", "message": "...", "details": ... } }`.
    Clients should branch on `code`, never on `message`.
servers:
  - url: /
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: ALIAS_TAKEN }
            message: { type: string }
            details: {}
    Link:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: 3kQ9xYa }
        shortUrl: { type: string, example: http://localhost:3004/3kQ9xYa }
        target: { type: string, example: https://example.com/page }
        title: { type: string }
        custom: { type: boolean, description: true when the code is an alias someone chose }
        expiresAt: { type: string, format: date-time, nullable: true }
        maxClicks: { type: integer, nullable: true }
        clicks: { type: integer, description: Human clicks, all time }
        status: { type: string, enum: [active, disabled, expired, used_up] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        last14:
          type: array
          items: { type: integer }
          description: Clicks per UTC day for the last 14 days, oldest first (list endpoint only)
    NameCount:
      type: object
      properties:
        name: { type: string }
        clicks: { type: integer }
  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - bearer: []
paths:
  /{code}:
    get:
      tags: [Redirect]
      summary: Follow a short link
      security: []
      description: |
        302 to the target with `Cache-Control: private, no-store`, so every click reaches the server.
        Links with a click limit are counted atomically; bots and link previews never use up a limit.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '302': { description: Redirect to the target }
        '404': { description: Unknown or deleted link (HTML page) }
        '410': { description: Switched off, expired or used up (HTML page) }
  /api/peek/{code}:
    get:
      tags: [Redirect]
      summary: See where a short link goes, without opening it
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Target and status
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  target: { type: string }
                  title: { type: string }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }
  /api/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201': { description: Token and user }
        '409': { $ref: '#/components/responses/Problem' }
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Token and user }
        '401': { $ref: '#/components/responses/Problem' }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      responses:
        '200': { description: User }
  /api/links:
    post:
      tags: [Links]
      summary: Shorten a link
      description: |
        Rate limited per account with a token bucket shared by all server instances
        (`RateLimit-Limit`, `RateLimit-Remaining`; `Retry-After` on 429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: example.com/a-long-page }
                alias: { type: string, example: spring-sale, description: Optional custom code }
                title: { type: string }
                expiresAt: { type: string, format: date-time, nullable: true }
                maxClicks: { type: integer, minimum: 1, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '400': { description: 'INVALID_URL, INVALID_ALIAS, EXPIRY_IN_PAST, VALIDATION_FAILED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'ALIAS_TAKEN, ALIAS_RESERVED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: RATE_LIMITED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [Links]
      summary: Your links, newest first
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search code, target and title }
        - { name: cursor, in: query, schema: { type: integer }, description: nextCursor from the previous page }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: A page of links
          content:
            application/json:
              schema:
                type: object
                properties:
                  links: { type: array, items: { $ref: '#/components/schemas/Link' } }
                  nextCursor: { type: integer, nullable: true }
  /api/links/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Links]
      summary: One link
      responses:
        '200': { description: Link, content: { application/json: { schema: { $ref: '#/components/schemas/Link' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Links]
      summary: Change target, title, expiry, click limit, or switch off
      description: Takes effect on the next click (the redirect cache entry is dropped).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                title: { type: string }
                expiresAt: { type: string, format: date-time, nullable: true }
                maxClicks: { type: integer, nullable: true }
                disabled: { type: boolean }
      responses:
        '200': { description: Updated link }
        '409': { description: BELOW_CLICK_COUNT }
    delete:
      tags: [Links]
      summary: Delete a link
      description: The code is kept reserved forever, so an old short link can never point somewhere new.
      responses:
        '204': { description: Deleted }
  /api/links/{id}/stats:
    get:
      tags: [Analytics]
      summary: Clicks, visitors, referrers, devices, browsers and hours for one link
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: days, in: query, schema: { type: integer, default: 30, minimum: 1, maximum: 365 } }
        - { name: tz, in: query, schema: { type: string, default: UTC, example: Asia/Karachi } }
      responses:
        '200':
          description: Stats. Bots are excluded and counted separately in totals.botsIgnored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  range: { type: object, properties: { days: { type: integer }, tz: { type: string }, from: { type: string }, to: { type: string } } }
                  totals:
                    type: object
                    properties:
                      clicks: { type: integer }
                      visitors: { type: integer, description: Sum of each day's unique visitors }
                      botsIgnored: { type: integer }
                      allTime: { type: integer }
                  series: { type: array, items: { type: object, properties: { day: { type: string }, clicks: { type: integer }, visitors: { type: integer } } } }
                  referrers: { type: array, items: { $ref: '#/components/schemas/NameCount' } }
                  devices: { type: array, items: { $ref: '#/components/schemas/NameCount' } }
                  browsers: { type: array, items: { $ref: '#/components/schemas/NameCount' } }
                  hours: { type: array, items: { type: object, properties: { hour: { type: integer }, clicks: { type: integer } } } }
        '400': { description: INVALID_TIMEZONE }
  /api/stats/overview:
    get:
      tags: [Analytics]
      summary: Totals across all your links (from the daily rollup)
      responses:
        '200': { description: links, allTime, today, last7, 30-day series and top links this week }
